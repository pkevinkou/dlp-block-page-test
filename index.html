<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>kevinkou — 測試站</title>
<style>
  :root { --ink:#1d242b; --sub:#5a6068; --line:#e5e3de; --accent:#007465; --bg:#f7f6f3; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Noto Sans TC",system-ui,-apple-system,sans-serif;
         background:var(--bg); color:var(--ink); line-height:1.6; }
  .wrap { max-width:680px; margin:0 auto; padding:64px 24px 80px; }
  header h1 { font-size:26px; margin:0 0 6px; letter-spacing:-.01em; }
  header p { color:var(--sub); font-size:14px; margin:0 0 40px; }
  h2 { font-size:12px; letter-spacing:.16em; color:var(--sub); font-weight:700;
       border-bottom:1px solid var(--line); padding-bottom:8px; margin:36px 0 6px; }
  ul { list-style:none; margin:0; padding:0; }
  li a { display:flex; align-items:baseline; gap:12px; text-decoration:none; color:inherit;
         padding:14px 4px; border-bottom:1px solid var(--line); transition:padding-left .12s; }
  li a:hover { padding-left:10px; background:#fff; }
  .name { font-size:16px; font-weight:600; }
  .path { font-family:ui-monospace,Menlo,monospace; font-size:12px; color:var(--accent); }
  .desc { color:var(--sub); font-size:13px; margin-left:auto; text-align:right; }
  footer { margin-top:56px; color:var(--sub); font-size:12px; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>kevinkou 測試站</h1>
      <p>個人測試與小工具集合 · <span class="path">kevinkou.netlify.app</span></p>
    </header>

    <h2>頁面</h2>
    <ul>
      <li><a href="/dlptest/">
        <span class="name">DLP Test Echo</span>
        <span class="path">/dlptest</span>
        <span class="desc">文字／檔案上傳回顯，含完整 HTTP header</span>
      </a></li>
      <li><a href="/pat/">
        <span class="name">照片桌寵</span>
        <span class="path">/pat</span>
        <span class="desc">上傳照片變成會動的桌面寵物</span>
      </a></li>
    </ul>

    <footer>此為個人測試網站，內容隨時可能變動。</footer>
  </div>
</body>
</html>
