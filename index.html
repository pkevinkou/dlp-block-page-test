<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DLP Test Echo</title>
<style>
  body { font-family: Arial, Tahoma, Verdana, sans-serif; max-width: 640px; margin: 60px auto; padding: 0 20px; color: #222; }
  h1 { font-size: 20px; }
  textarea { width: 100%; height: 120px; font-family: monospace; font-size: 14px; box-sizing: border-box; }
  input[type=file] { margin-top: 8px; }
  button { margin-top: 16px; padding: 8px 24px; font-size: 14px; cursor: pointer; }
  #result { margin-top: 20px; padding: 12px; background: #f4f4f4; border: 1px solid #ddd; white-space: pre-wrap; word-break: break-all; font-family: monospace; font-size: 13px; display: none; }
  .note { color: #777; font-size: 12px; margin-top: 8px; }
</style>
</head>
<body>
<h1>DLP Test Echo</h1>
<p>純測試用：送出的文字/檔案只會被即時回顯位元組數，不會被儲存。</p>

<form id="f">
  <label>文字內容</label>
  <textarea name="text" id="text"></textarea>
  <br>
  <label>檔案（可選）</label><br>
  <input type="file" name="file" id="file">
  <br>
  <button type="submit">送出</button>
</form>

<div id="result"></div>
<p class="note">Client IP不記錄、內容不落地存檔，收到後只回傳大小資訊。</p>

<script>
document.getElementById('f').addEventListener('submit', async function (e) {
  e.preventDefault();
  const fd = new FormData(this);
  const resultEl = document.getElementById('result');
  resultEl.style.display = 'block';
  resultEl.textContent = '送出中...';
  try {
    const res = await fetch('/api/echo', { method: 'POST', body: fd });
    const data = await res.json();
    resultEl.textContent = JSON.stringify(data, null, 2);
  } catch (err) {
    resultEl.textContent = '錯誤: ' + err.message;
  }
});
</script>
</body>
</html>
